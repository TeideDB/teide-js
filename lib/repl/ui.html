<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TeideDB Web Console</title>
<style>
:root {
    --bg: #1e1e2e;
    --bg-surface: #181825;
    --fg: #cdd6f4;
    --border: #45475a;
    --header: #89dceb;
    --type-dim: #6c7086;
    --null: #6c7086;
    --string: #a6e3a1;
    --number: #89b4fa;
    --keyword: #cba6f7;
    --error: #f38ba8;
    --success: #a6e3a1;
    --selection: #313244;
    --accent: #89b4fa;
    --run-btn-bg: #a6e3a1;
    --rail-width: 44px;
    --panel-width: 224px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
    font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', 'JetBrains Mono', monospace;
    font-size: 13px;
    background: var(--bg);
    color: var(--fg);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

/* ── Top bar ─────────────────────────────────────────────── */
.topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 40px;
    padding: 0 16px 0 12px;
    border-bottom: 1px solid var(--border);
    background: var(--bg-surface);
    flex-shrink: 0;
    z-index: 10;
}
.topbar-brand {
    display: flex;
    align-items: center;
    gap: 8px;
}
.topbar-icon {
    width: 22px;
    height: 22px;
    flex-shrink: 0;
}
.topbar-name {
    font-size: 14px;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: 0.5px;
}
.topbar-version {
    font-size: 11px;
    color: var(--type-dim);
    font-weight: 400;
}
.topbar-conn {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--type-dim);
}
.conn-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    display: inline-block;
    flex-shrink: 0;
}
.conn-dot.connected    { background: var(--success); box-shadow: 0 0 4px var(--success); }
.conn-dot.disconnected { background: var(--error); }

/* ── Main layout ─────────────────────────────────────────── */
.main {
    display: flex;
    flex: 1;
    min-height: 0;
}

/* ── Left sidebar (icon rail + expandable panel) ─────────── */
.sidebar {
    display: flex;
    flex-shrink: 0;
    border-right: 1px solid var(--border);
    background: var(--bg-surface);
}

/* icon rail */
.sidebar-rail {
    width: var(--rail-width);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: 6px;
    gap: 2px;
    border-right: 1px solid var(--border);
    flex-shrink: 0;
}
.rail-btn {
    width: 32px;
    height: 32px;
    border-radius: 6px;
    border: none;
    background: none;
    color: var(--type-dim);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: background 0.1s, color 0.1s;
}
.rail-btn:hover  { background: var(--selection); color: var(--fg); }
.rail-btn.active { background: var(--selection); color: var(--accent); }
.rail-btn svg { width: 17px; height: 17px; pointer-events: none; }

/* expandable panel */
.sidebar-panel {
    width: var(--panel-width);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    flex-shrink: 0;
}
.sidebar-panel.collapsed { width: 0; }

.panel-section {
    display: flex;
    flex-direction: column;
    flex: 1;
    min-height: 0;
    overflow: hidden;
}
.panel-section + .panel-section {
    border-top: 1px solid var(--border);
    flex: 0 0 auto;
    max-height: 40%;
}

.panel-header {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    color: var(--type-dim);
    padding: 8px 12px 6px;
    flex-shrink: 0;
    white-space: nowrap;
}

/* table tree */
.tree-list {
    list-style: none;
    overflow-y: auto;
    flex: 1;
    min-height: 0;
}
.tree-item {
    user-select: none;
}
.tree-item-row {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 3px 10px 3px 10px;
    cursor: pointer;
    white-space: nowrap;
    overflow: hidden;
}
.tree-item-row:hover { background: var(--selection); }
.tree-item-row.expanded { background: rgba(49,50,68,0.5); }
.tree-chevron {
    width: 10px;
    height: 10px;
    flex-shrink: 0;
    color: var(--type-dim);
    transition: transform 0.15s;
}
.tree-chevron.open { transform: rotate(90deg); }
.tree-tbl-icon {
    width: 13px;
    height: 13px;
    flex-shrink: 0;
    color: var(--accent);
    opacity: 0.7;
}
.tree-name {
    font-size: 12px;
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
}
.tree-meta {
    font-size: 10px;
    color: var(--type-dim);
    flex-shrink: 0;
}

/* column sub-list */
.tree-cols {
    list-style: none;
    display: none;
    background: rgba(24,24,37,0.6);
}
.tree-cols.open { display: block; }
.tree-col-row {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 2px 10px 2px 30px;
    font-size: 11px;
    white-space: nowrap;
    overflow: hidden;
}
.tree-col-name { color: var(--fg); flex: 1; overflow: hidden; text-overflow: ellipsis; }
.tree-col-type { color: var(--type-dim); flex-shrink: 0; }

/* history list */
.hist-list {
    list-style: none;
    overflow-y: auto;
    flex: 1;
    min-height: 0;
}
.hist-item {
    padding: 4px 10px;
    font-size: 11px;
    cursor: pointer;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    color: var(--type-dim);
    border-bottom: 1px solid rgba(69,71,90,0.25);
}
.hist-item:hover { background: var(--selection); color: var(--fg); }

/* ── Content area ────────────────────────────────────────── */
.content {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
    overflow: hidden;
}

/* editor tab bar */
.tab-bar {
    display: flex;
    align-items: stretch;
    height: 34px;
    border-bottom: 1px solid var(--border);
    background: var(--bg-surface);
    flex-shrink: 0;
    padding-left: 2px;
}
.tab {
    display: flex;
    align-items: center;
    padding: 0 14px;
    font-size: 12px;
    cursor: pointer;
    border-right: 1px solid var(--border);
    color: var(--type-dim);
    background: transparent;
    border-bottom: 2px solid transparent;
    white-space: nowrap;
}
.tab.active {
    color: var(--fg);
    background: var(--bg);
    border-bottom-color: var(--accent);
}
.tab-add {
    display: flex;
    align-items: center;
    padding: 0 10px;
    font-size: 16px;
    cursor: pointer;
    color: var(--type-dim);
    background: transparent;
    border: none;
    font-family: inherit;
    line-height: 1;
}
.tab-add:hover { color: var(--fg); }

/* editor section */
.editor-section {
    display: flex;
    flex-direction: column;
    /* height set by JS splitter; fallback */
    height: 55%;
    flex-shrink: 0;
    min-height: 80px;
    position: relative;
}

#editor-container {
    flex: 1;
    overflow: hidden;
    min-height: 0;
}
#editor-container .cm-editor { height: 100%; }
#editor-container .cm-scroller { overflow: auto; }

/* run button overlay (bottom-right of editor) */
.run-btn-wrap {
    position: absolute;
    bottom: 8px;
    right: 10px;
    z-index: 5;
}
.run-btn {
    background: var(--run-btn-bg);
    color: #11111b;
    border: none;
    padding: 0;
    border-radius: 5px;
    cursor: pointer;
    font-family: inherit;
    font-size: 12px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 0;
    overflow: hidden;
    height: 30px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.4);
    transition: opacity 0.1s;
}
.run-btn:hover { opacity: 0.88; }
.run-btn-label {
    padding: 0 10px;
}
.run-btn-kbd {
    padding: 0 8px;
    background: rgba(0,0,0,0.18);
    font-size: 10px;
    font-weight: 600;
    border-left: 1px solid rgba(0,0,0,0.22);
    height: 100%;
    display: flex;
    align-items: center;
    color: rgba(17,17,27,0.75);
    letter-spacing: 0.2px;
    white-space: nowrap;
}

/* splitter handle */
.splitter {
    height: 5px;
    background: var(--bg-surface);
    border-top: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    cursor: row-resize;
    flex-shrink: 0;
    transition: background 0.1s;
    position: relative;
}
.splitter::after {
    content: '';
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: 32px;
    height: 3px;
    border-radius: 2px;
    background: var(--border);
}
.splitter:hover { background: var(--selection); }
.splitter:hover::after { background: var(--accent); }

/* results section */
.results-section {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-height: 0;
    overflow: hidden;
}

/* log bar */
.log-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 12px;
    height: 28px;
    background: #11111b;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    gap: 16px;
    overflow: hidden;
}
.log-bar-left {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    flex-shrink: 0;
    white-space: nowrap;
}
.log-ts {
    color: var(--type-dim);
}
.log-check {
    color: var(--success);
    font-size: 12px;
}
.log-check.error { color: var(--error); }
.log-check.waiting { color: var(--type-dim); }
.log-msg {
    color: var(--fg);
}
.log-bar-right {
    font-size: 11px;
    color: var(--type-dim);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    text-align: right;
    flex: 1;
    min-width: 0;
}
.log-stat {
    margin-left: 10px;
}

/* result toolbar */
.result-toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 12px;
    height: 32px;
    background: var(--bg-surface);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
}
.result-row-count {
    font-size: 12px;
    color: var(--type-dim);
}
.result-row-count strong {
    color: var(--fg);
    font-weight: 600;
}
.export-wrap {
    position: relative;
}
.export-btn {
    display: flex;
    align-items: center;
    gap: 5px;
    background: var(--selection);
    border: 1px solid var(--border);
    color: var(--fg);
    padding: 3px 10px;
    border-radius: 4px;
    cursor: pointer;
    font-family: inherit;
    font-size: 11px;
    font-weight: 500;
    transition: border-color 0.1s;
}
.export-btn:hover { border-color: var(--accent); }
.export-caret {
    font-size: 9px;
    color: var(--type-dim);
}
.export-dropdown {
    display: none;
    position: absolute;
    right: 0;
    top: calc(100% + 3px);
    background: var(--bg-surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    min-width: 130px;
    z-index: 100;
    box-shadow: 0 4px 16px rgba(0,0,0,0.4);
}
.export-dropdown.open { display: block; }
.export-dropdown button {
    display: block;
    width: 100%;
    background: none;
    border: none;
    color: var(--fg);
    font-family: inherit;
    font-size: 12px;
    padding: 6px 12px;
    text-align: left;
    cursor: pointer;
    white-space: nowrap;
}
.export-dropdown button:hover { background: var(--selection); }

/* table container */
.table-outer {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-height: 0;
    overflow: hidden;
}
.table-header {
    display: flex;
    background: var(--bg-surface);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    overflow: hidden;
}
.table-header .th {
    padding: 6px 12px 4px;
    color: var(--header);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    flex-shrink: 0;
    border-right: 1px dashed rgba(69,71,90,0.5);
    display: flex;
    flex-direction: column;
    gap: 1px;
}
.table-header .th:last-child { border-right: none; }
.table-header .th .col-name { font-weight: 700; font-size: 12px; }
.table-header .th .dtype { color: var(--type-dim); font-weight: 400; font-size: 10px; }
.scroll-viewport {
    overflow-y: auto;
    overflow-x: hidden;
    flex: 1;
    position: relative;
}
.scroll-spacer { position: relative; width: 100%; }
.table-row {
    display: flex;
    position: absolute;
    width: 100%;
    left: 0;
    border-bottom: 1px solid rgba(26,26,46,0.7);
}
.table-row:nth-child(odd) { background: rgba(49,50,68,0.10); }
.table-row:hover { background: var(--selection); }
.table-row .td {
    padding: 4px 12px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    flex-shrink: 0;
    height: 32px;
    line-height: 24px;
    border-right: 1px dashed rgba(69,71,90,0.28);
}
.table-row .td:last-child { border-right: none; }
.td.numeric  { text-align: right; color: var(--number); }
.td.null-val { color: var(--null); font-style: italic; }

/* print output */
.print-output {
    padding: 12px 16px;
    white-space: pre-wrap;
    font-size: 13px;
    overflow-y: auto;
    flex: 1;
    line-height: 1.6;
}

/* empty state */
.empty-state {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    color: var(--type-dim);
    font-size: 13px;
}
.empty-state-icon {
    font-size: 28px;
    opacity: 0.3;
}

/* footer */
.footer {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 12px;
    padding: 0 16px;
    height: 26px;
    border-top: 1px solid var(--border);
    background: var(--bg-surface);
    flex-shrink: 0;
    font-size: 11px;
    color: var(--type-dim);
}
.footer-conn {
    display: flex;
    align-items: center;
    gap: 5px;
}
</style>
</head>
<body>

<!-- Top bar -->
<div class="topbar">
    <div class="topbar-brand">
        <svg class="topbar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="color:var(--accent)">
            <ellipse cx="12" cy="5" rx="9" ry="3"/>
            <path d="M3 5v5c0 1.66 4.03 3 9 3s9-1.34 9-3V5"/>
            <path d="M3 10v5c0 1.66 4.03 3 9 3s9-1.34 9-3v-5"/>
            <path d="M3 15v4c0 1.66 4.03 3 9 3s9-1.34 9-3v-4"/>
        </svg>
        <span class="topbar-name">TeideDB</span>
        <span class="topbar-version">v__VERSION__</span>
    </div>
    <div class="topbar-conn">
        <span class="conn-dot disconnected" id="conn-dot"></span>
        <span id="conn-label">Connecting...</span>
    </div>
</div>

<!-- Main -->
<div class="main">

    <!-- Left sidebar -->
    <div class="sidebar">
        <!-- Icon rail -->
        <div class="sidebar-rail">
            <button class="rail-btn active" id="rail-tables" title="Tables">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="18" height="18" rx="2"/>
                    <line x1="3" y1="9" x2="21" y2="9"/>
                    <line x1="3" y1="15" x2="21" y2="15"/>
                    <line x1="9" y1="9" x2="9" y2="21"/>
                </svg>
            </button>
            <button class="rail-btn" id="rail-history" title="History">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="9"/>
                    <polyline points="12 7 12 12 15 15"/>
                </svg>
            </button>
        </div>

        <!-- Expandable panel -->
        <div class="sidebar-panel" id="sidebar-panel">
            <!-- Tables section -->
            <div class="panel-section" id="panel-tables">
                <div class="panel-header" id="tables-header">Tables (0)</div>
                <ul class="tree-list" id="table-list"></ul>
            </div>
            <!-- History section -->
            <div class="panel-section" id="panel-history" style="display:none">
                <div class="panel-header">History</div>
                <ul class="hist-list" id="history-list"></ul>
            </div>
        </div>
    </div>

    <!-- Content area -->
    <div class="content">
        <!-- Tab bar -->
        <div class="tab-bar">
            <div class="tab active">SQL 1</div>
            <button class="tab-add" title="New tab">+</button>
        </div>

        <!-- Editor section (resizable) -->
        <div class="editor-section" id="editor-section">
            <div id="editor-container"></div>
            <div class="run-btn-wrap">
                <button class="run-btn" id="run-btn">
                    <span class="run-btn-label">Run query</span>
                    <span class="run-btn-kbd">Ctrl &#9166;</span>
                </button>
            </div>
        </div>

        <!-- Splitter -->
        <div class="splitter" id="splitter"></div>

        <!-- Results section -->
        <div class="results-section" id="results-section">

            <!-- Log bar -->
            <div class="log-bar" id="log-bar">
                <div class="log-bar-left">
                    <span class="log-ts" id="log-ts">--:--:--</span>
                    <span class="log-check waiting" id="log-icon">&#9711;</span>
                    <span class="log-msg" id="log-msg">Ready</span>
                </div>
                <div class="log-bar-right" id="log-right"></div>
            </div>

            <!-- Result toolbar -->
            <div class="result-toolbar" id="result-toolbar" style="display:none">
                <div class="result-row-count" id="result-row-count"></div>
                <div class="export-wrap">
                    <button class="export-btn" id="export-btn">
                        Download CSV <span class="export-caret">&#9660;</span>
                    </button>
                    <div class="export-dropdown" id="export-dropdown">
                        <button id="export-csv">Download CSV</button>
                        <button id="export-json">Download JSON</button>
                        <button id="export-clip">Copy as TSV</button>
                    </div>
                </div>
            </div>

            <!-- Result / empty area -->
            <div class="table-outer" id="result-area">
                <div class="empty-state" id="empty-state">
                    <span class="empty-state-icon">&#9783;</span>
                    Type a SQL query and press Ctrl+Enter
                </div>
            </div>

        </div>
    </div>
</div>

<!-- Footer -->
<div class="footer">
    <div class="footer-conn">
        <span class="conn-dot disconnected" id="footer-conn-dot"></span>
        <span id="footer-conn-label">Disconnected</span>
    </div>
    <span id="footer-version">v__VERSION__</span>
</div>

<script type="module">
import { EditorView, keymap, placeholder, lineNumbers, highlightActiveLineGutter, highlightSpecialChars, drawSelection, dropCursor, rectangularSelection, crosshairCursor, highlightActiveLine } from 'https://esm.sh/@codemirror/view@6';
import { EditorState } from 'https://esm.sh/@codemirror/state@6';
import { sql } from 'https://esm.sh/@codemirror/lang-sql@6';
import { oneDark } from 'https://esm.sh/@codemirror/theme-one-dark@6';
import { defaultKeymap, history, historyKeymap } from 'https://esm.sh/@codemirror/commands@6';
import { autocompletion, closeBrackets, closeBracketsKeymap, acceptCompletion } from 'https://esm.sh/@codemirror/autocomplete@6';
import { syntaxHighlighting, defaultHighlightStyle, bracketMatching, foldGutter, foldKeymap, indentOnInput } from 'https://esm.sh/@codemirror/language@6';
import { highlightSelectionMatches, searchKeymap } from 'https://esm.sh/@codemirror/search@6';

// ─── State ───────────────────────────────────
let ws = null;
let currentResult = null;  // { columns, rows, nrows }
let colWidths = [];
const ROW_HEIGHT = 32;
const BUFFER_ROWS = 20;
let pendingComplete = null;

// ─── DOM refs ────────────────────────────────
const connDot         = document.getElementById('conn-dot');
const connLabel       = document.getElementById('conn-label');
const footerConnDot   = document.getElementById('footer-conn-dot');
const footerConnLabel = document.getElementById('footer-conn-label');
const tableList       = document.getElementById('table-list');
const tablesHeader    = document.getElementById('tables-header');
const historyList     = document.getElementById('history-list');
const resultArea      = document.getElementById('result-area');
const emptyState      = document.getElementById('empty-state');
const runBtn          = document.getElementById('run-btn');
const logTs           = document.getElementById('log-ts');
const logIcon         = document.getElementById('log-icon');
const logMsg          = document.getElementById('log-msg');
const logRight        = document.getElementById('log-right');
const resultToolbar   = document.getElementById('result-toolbar');
const resultRowCount  = document.getElementById('result-row-count');

// ─── Sidebar panel toggle ────────────────────
const railTables  = document.getElementById('rail-tables');
const railHistory = document.getElementById('rail-history');
const panelTables = document.getElementById('panel-tables');
const panelHistory= document.getElementById('panel-history');

railTables.addEventListener('click', () => {
    const already = railTables.classList.contains('active');
    railTables.classList.toggle('active', !already);
    railHistory.classList.remove('active');
    panelTables.style.display  = already ? 'none' : 'flex';
    panelHistory.style.display = 'none';
});

railHistory.addEventListener('click', () => {
    const already = railHistory.classList.contains('active');
    railHistory.classList.toggle('active', !already);
    railTables.classList.remove('active');
    panelHistory.style.display = already ? 'none' : 'flex';
    panelTables.style.display  = 'none';
});

// ─── Export dropdown ─────────────────────────
const exportBtn      = document.getElementById('export-btn');
const exportDropdown = document.getElementById('export-dropdown');

exportBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    exportDropdown.classList.toggle('open');
});
document.addEventListener('click', () => exportDropdown.classList.remove('open'));

// ─── Splitter drag ───────────────────────────
const splitter      = document.getElementById('splitter');
const editorSection = document.getElementById('editor-section');
let dragActive = false;
let dragStartY = 0;
let dragStartH = 0;

splitter.addEventListener('mousedown', (e) => {
    dragActive = true;
    dragStartY = e.clientY;
    dragStartH = editorSection.getBoundingClientRect().height;
    document.body.style.cursor = 'row-resize';
    document.body.style.userSelect = 'none';
    e.preventDefault();
});
document.addEventListener('mousemove', (e) => {
    if (!dragActive) return;
    const delta = e.clientY - dragStartY;
    const newH = Math.max(80, dragStartH + delta);
    editorSection.style.height = newH + 'px';
    editorSection.style.flex = 'none';
});
document.addEventListener('mouseup', () => {
    if (dragActive) {
        dragActive = false;
        document.body.style.cursor = '';
        document.body.style.userSelect = '';
    }
});

// ─── Log bar helpers ─────────────────────────
function nowTs() {
    return new Date().toTimeString().slice(0, 8);
}

function setLog(state, message, rightText) {
    logTs.textContent = nowTs();
    logMsg.textContent = message;
    logRight.textContent = rightText || '';
    if (state === 'ok') {
        logIcon.className = 'log-check';
        logIcon.textContent = '\u2713';
    } else if (state === 'error') {
        logIcon.className = 'log-check error';
        logIcon.textContent = '\u2717';
    } else if (state === 'running') {
        logIcon.className = 'log-check waiting';
        logIcon.textContent = '\u25cb';
    } else {
        logIcon.className = 'log-check waiting';
        logIcon.textContent = '\u25cb';
    }
}

// ─── CodeMirror ──────────────────────────────
const sqlCompletion = autocompletion({
    activateOnTyping: true,
    override: [async (ctx) => {
        const word = ctx.matchBefore(/[\w.]+/);
        if (!word || word.text.length < 2) return null;
        const prefix = word.text;
        const fullText = ctx.state.doc.toString();

        return new Promise((resolve) => {
            pendingComplete = (items) => {
                resolve({
                    from: word.from,
                    options: items.map(i => ({
                        label: i.value,
                        detail: i.description,
                        type: i.description === 'keyword' ? 'keyword' : 'variable',
                    })),
                });
                pendingComplete = null;
            };
            wsSend({ type: 'complete', prefix, context: fullText });
            // Timeout fallback
            setTimeout(() => {
                if (pendingComplete) {
                    pendingComplete([]);
                }
            }, 500);
        });
    }],
});

const runKeymap = keymap.of([{
    key: 'Ctrl-Enter',
    mac: 'Cmd-Enter',
    run: () => { executeQuery(); return true; },
}]);

const editor = new EditorView({
    state: EditorState.create({
        doc: '',
        extensions: [
            runKeymap,
            lineNumbers(),
            highlightActiveLineGutter(),
            highlightSpecialChars(),
            history(),
            foldGutter(),
            drawSelection(),
            dropCursor(),
            EditorState.allowMultipleSelections.of(true),
            indentOnInput(),
            syntaxHighlighting(defaultHighlightStyle, { fallback: true }),
            bracketMatching(),
            closeBrackets(),
            rectangularSelection(),
            crosshairCursor(),
            highlightActiveLine(),
            highlightSelectionMatches(),
            keymap.of([
                { key: 'Tab', run: acceptCompletion },
                ...closeBracketsKeymap,
                ...defaultKeymap,
                ...searchKeymap,
                ...historyKeymap,
                ...foldKeymap,
            ]),
            sql(),
            oneDark,
            sqlCompletion,
            placeholder('SELECT * FROM ...'),
            EditorView.theme({
                '&': { fontSize: '13px' },
                '.cm-content': { fontFamily: "'SF Mono', 'Cascadia Code', 'Fira Code', monospace" },
            }),
        ],
    }),
    parent: document.getElementById('editor-container'),
});

// ─── WebSocket ───────────────────────────────
function connect() {
    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    ws = new WebSocket(`${proto}//${location.host}`);

    ws.onopen = () => {
        connDot.className = 'conn-dot connected';
        connLabel.textContent = 'Connected';
        footerConnDot.className = 'conn-dot connected';
        footerConnLabel.textContent = 'Connected';
        setLog('ok', 'Connected', '');
    };

    ws.onclose = () => {
        connDot.className = 'conn-dot disconnected';
        connLabel.textContent = 'Disconnected';
        footerConnDot.className = 'conn-dot disconnected';
        footerConnLabel.textContent = 'Disconnected';
        setLog('error', 'Connection lost. Reconnecting...', '');
        setTimeout(connect, 2000);
    };

    ws.onmessage = (ev) => {
        const msg = JSON.parse(ev.data);
        handleServerMessage(msg);
    };
}

function wsSend(obj) {
    if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify(obj));
    }
}

// ─── Message handling ────────────────────────
function handleServerMessage(msg) {
    switch (msg.type) {
        case 'result':
            showResult(msg);
            break;
        case 'error':
            showError(msg.message);
            break;
        case 'ok':
            showOk(msg.message, msg.elapsed);
            break;
        case 'completions':
            if (pendingComplete) pendingComplete(msg.items);
            break;
        case 'meta':
            updateMeta(msg);
            break;
        case 'print':
            if (msg.text === '__CLEAR__') {
                clearResults();
            } else {
                showPrint(msg.text);
            }
            break;
    }
}

// ─── Query execution ─────────────────────────
let queryId = 0;
let lastSql = '';

function executeQuery() {
    const sqlText = editor.state.doc.toString().trim();
    if (!sqlText) return;
    lastSql = sqlText;
    const id = String(++queryId);
    setLog('running', 'Running...', truncate(sqlText, 80));
    resultToolbar.style.display = 'none';
    wsSend({ type: 'query', id, sql: sqlText });
}

runBtn.addEventListener('click', executeQuery);

// ─── Result rendering ────────────────────────
function showResult(msg) {
    currentResult = msg;
    const elapsed = msg.elapsed.toFixed(2);
    const rowsLabel = `${msg.nrows} row${msg.nrows !== 1 ? 's' : ''}`;

    // Log bar
    setLog('ok',
        `${rowsLabel} in ${elapsed}ms`,
        `Execute: ${(msg.elapsed * 1000).toFixed(0)}\u03bcs  \u00b7  Total: ${elapsed}ms`
    );

    // Result toolbar
    resultToolbar.style.display = 'flex';
    resultRowCount.innerHTML = `<strong>${msg.nrows}</strong> row${msg.nrows !== 1 ? 's' : ''}`;

    // Calculate column widths
    colWidths = msg.columns.map((col, i) => {
        let max = col.name.length + (col.dtype.length + 2); // +2 for dtype badge
        for (let r = 0; r < Math.min(msg.rows.length, 100); r++) {
            const cell = msg.rows[r][i];
            if (cell !== null) max = Math.max(max, cell.length);
        }
        return Math.min(Math.max(max * 8 + 24, 80), 400);
    });

    renderTable();
}

function renderTable() {
    const msg = currentResult;
    if (!msg) return;

    resultArea.innerHTML = '';

    // Header
    const headerDiv = document.createElement('div');
    headerDiv.className = 'table-header';
    msg.columns.forEach((col, i) => {
        const th = document.createElement('div');
        th.className = 'th';
        th.style.width = colWidths[i] + 'px';
        th.innerHTML = `<span class="col-name">${esc(col.name)}</span><span class="dtype">${esc(col.dtype)}</span>`;
        headerDiv.appendChild(th);
    });
    resultArea.appendChild(headerDiv);

    // Scroll viewport
    const viewport = document.createElement('div');
    viewport.className = 'scroll-viewport';
    viewport.style.flex = '1';

    const spacer = document.createElement('div');
    spacer.className = 'scroll-spacer';
    spacer.style.height = (msg.rows.length * ROW_HEIGHT) + 'px';
    viewport.appendChild(spacer);
    resultArea.appendChild(viewport);

    // Track rendered range
    let renderedStart = -1;
    let renderedEnd = -1;
    const rowPool = [];

    function renderVisibleRows() {
        const scrollTop = viewport.scrollTop;
        const viewHeight = viewport.clientHeight;
        const start = Math.max(0, Math.floor(scrollTop / ROW_HEIGHT) - BUFFER_ROWS);
        const end = Math.min(msg.rows.length, Math.ceil((scrollTop + viewHeight) / ROW_HEIGHT) + BUFFER_ROWS);

        if (start === renderedStart && end === renderedEnd) return;
        renderedStart = start;
        renderedEnd = end;

        // Remove old rows
        while (rowPool.length > 0) {
            const el = rowPool.pop();
            el.remove();
        }

        // Determine which columns are numeric
        const numericCols = msg.columns.map(c => isNumericDtype(c.dtype));

        for (let r = start; r < end; r++) {
            const row = msg.rows[r];
            const rowDiv = document.createElement('div');
            rowDiv.className = 'table-row';
            rowDiv.style.top = (r * ROW_HEIGHT) + 'px';

            for (let c = 0; c < row.length; c++) {
                const td = document.createElement('div');
                td.className = 'td';
                td.style.width = colWidths[c] + 'px';
                const val = row[c];
                if (val === null) {
                    td.classList.add('null-val');
                    td.textContent = 'null';
                } else {
                    if (numericCols[c]) td.classList.add('numeric');
                    td.textContent = val;
                }
                rowDiv.appendChild(td);
            }

            spacer.appendChild(rowDiv);
            rowPool.push(rowDiv);
        }
    }

    viewport.addEventListener('scroll', renderVisibleRows);
    // Initial render
    requestAnimationFrame(renderVisibleRows);

    // Make result area a flex column
    resultArea.style.display = 'flex';
    resultArea.style.flexDirection = 'column';
    resultArea.style.flex = '1';
    resultArea.style.minHeight = '0';
}

function isNumericDtype(dtype) {
    return /^(i8|i16|i32|i64|u8|u16|u32|u64|f32|f64|int|float|double|decimal)/.test(dtype);
}

function showError(message) {
    setLog('error', message, truncate(lastSql, 80));
    resultToolbar.style.display = 'none';
    // Clear table area but leave empty state visible
    resultArea.innerHTML = '';
    resultArea.style.display = '';
    const es = document.createElement('div');
    es.className = 'empty-state';
    es.innerHTML = `<span style="color:var(--error);font-size:13px">\u26a0 ${esc(message)}</span>`;
    resultArea.appendChild(es);
}

function showOk(message, elapsed) {
    const elapsedStr = elapsed > 0 ? `  \u00b7  ${elapsed.toFixed(2)}ms` : '';
    setLog('ok', message, elapsed > 0 ? `Total: ${elapsed.toFixed(2)}ms` : '');
    resultToolbar.style.display = 'none';
    // Refresh meta after DDL
    wsSend({ type: 'meta' });
}

function showPrint(text) {
    resultArea.innerHTML = '';
    resultArea.style.display = '';
    const pre = document.createElement('div');
    pre.className = 'print-output';
    pre.textContent = text;
    resultArea.appendChild(pre);
    setLog('ok', 'Output', '');
    resultToolbar.style.display = 'none';
}

function clearResults() {
    currentResult = null;
    resultArea.innerHTML = '';
    resultArea.style.display = '';
    const es = document.createElement('div');
    es.className = 'empty-state';
    es.innerHTML = '<span class="empty-state-icon">&#9783;</span>Type a SQL query and press Ctrl+Enter';
    resultArea.appendChild(es);
    setLog('idle', 'Ready', '');
    resultToolbar.style.display = 'none';
}

// ─── Sidebar: tables tree ─────────────────────
function updateMeta(msg) {
    // Tables tree
    tableList.innerHTML = '';
    tablesHeader.textContent = `Tables (${msg.tables.length})`;

    for (const t of msg.tables) {
        const li = document.createElement('li');
        li.className = 'tree-item';

        const rowEl = document.createElement('div');
        rowEl.className = 'tree-item-row';

        const chevron = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
        chevron.setAttribute('viewBox', '0 0 24 24');
        chevron.setAttribute('fill', 'none');
        chevron.setAttribute('stroke', 'currentColor');
        chevron.setAttribute('stroke-width', '2.5');
        chevron.setAttribute('stroke-linecap', 'round');
        chevron.setAttribute('stroke-linejoin', 'round');
        chevron.classList.add('tree-chevron');
        const chevPath = document.createElementNS('http://www.w3.org/2000/svg', 'polyline');
        chevPath.setAttribute('points', '9 18 15 12 9 6');
        chevron.appendChild(chevPath);

        const tblIcon = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
        tblIcon.setAttribute('viewBox', '0 0 24 24');
        tblIcon.setAttribute('fill', 'none');
        tblIcon.setAttribute('stroke', 'currentColor');
        tblIcon.setAttribute('stroke-width', '1.8');
        tblIcon.setAttribute('stroke-linecap', 'round');
        tblIcon.setAttribute('stroke-linejoin', 'round');
        tblIcon.classList.add('tree-tbl-icon');
        const r1 = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
        r1.setAttribute('x', '3'); r1.setAttribute('y', '3'); r1.setAttribute('width', '18'); r1.setAttribute('height', '18'); r1.setAttribute('rx', '2');
        const l1 = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        l1.setAttribute('x1', '3'); l1.setAttribute('y1', '9'); l1.setAttribute('x2', '21'); l1.setAttribute('y2', '9');
        const l2 = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        l2.setAttribute('x1', '3'); l2.setAttribute('y1', '15'); l2.setAttribute('x2', '21'); l2.setAttribute('y2', '15');
        tblIcon.appendChild(r1); tblIcon.appendChild(l1); tblIcon.appendChild(l2);

        const nameSpan = document.createElement('span');
        nameSpan.className = 'tree-name';
        nameSpan.textContent = t.name;

        const metaSpan = document.createElement('span');
        metaSpan.className = 'tree-meta';
        metaSpan.textContent = t.nrows + 'r';

        rowEl.appendChild(chevron);
        rowEl.appendChild(tblIcon);
        rowEl.appendChild(nameSpan);
        rowEl.appendChild(metaSpan);

        // Columns sub-list (lazy populated on expand)
        const colsUl = document.createElement('ul');
        colsUl.className = 'tree-cols';

        // Build column rows if available
        if (t.columns && t.columns.length) {
            for (const col of t.columns) {
                const cli = document.createElement('li');
                cli.className = 'tree-col-row';
                cli.innerHTML = `<span class="tree-col-name">${esc(col.name)}</span><span class="tree-col-type">${esc(col.dtype)}</span>`;
                colsUl.appendChild(cli);
            }
        }

        // Click on row: expand/collapse columns; double-click inserts table name
        rowEl.addEventListener('click', () => {
            const isOpen = colsUl.classList.toggle('open');
            chevron.classList.toggle('open', isOpen);
            rowEl.classList.toggle('expanded', isOpen);
        });
        rowEl.addEventListener('dblclick', (e) => {
            e.stopPropagation();
            const pos = editor.state.selection.main.head;
            editor.dispatch({ changes: { from: pos, insert: t.name } });
            editor.focus();
        });

        li.appendChild(rowEl);
        li.appendChild(colsUl);
        tableList.appendChild(li);
    }

    // History list
    historyList.innerHTML = '';
    const hist = (msg.history || []).slice(-50).reverse();
    for (const h of hist) {
        const li = document.createElement('li');
        li.className = 'hist-item';
        li.textContent = h.length > 60 ? h.slice(0, 57) + '...' : h;
        li.title = h;
        li.addEventListener('click', () => {
            editor.dispatch({
                changes: { from: 0, to: editor.state.doc.length, insert: h },
            });
            editor.focus();
        });
        historyList.appendChild(li);
    }
}

// ─── Export ──────────────────────────────────
document.getElementById('export-csv').addEventListener('click', () => {
    if (!currentResult) return;
    exportDropdown.classList.remove('open');
    const lines = [];
    lines.push(currentResult.columns.map(c => csvEscape(c.name)).join(','));
    for (const row of currentResult.rows) {
        lines.push(row.map(v => v === null ? '' : csvEscape(v)).join(','));
    }
    download(lines.join('\n'), 'result.csv', 'text/csv');
});

document.getElementById('export-json').addEventListener('click', () => {
    if (!currentResult) return;
    exportDropdown.classList.remove('open');
    const objs = currentResult.rows.map(row => {
        const obj = {};
        currentResult.columns.forEach((col, i) => { obj[col.name] = row[i]; });
        return obj;
    });
    download(JSON.stringify(objs, null, 2), 'result.json', 'application/json');
});

document.getElementById('export-clip').addEventListener('click', () => {
    if (!currentResult) return;
    exportDropdown.classList.remove('open');
    const lines = [];
    lines.push(currentResult.columns.map(c => c.name).join('\t'));
    for (const row of currentResult.rows) {
        lines.push(row.map(v => v === null ? 'null' : v).join('\t'));
    }
    navigator.clipboard.writeText(lines.join('\n'));
    setLog('ok', 'Copied to clipboard', '');
});

// ─── Helpers ─────────────────────────────────
function esc(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function csvEscape(s) {
    if (/[,"\n]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
    return s;
}

function download(content, filename, mime) {
    const blob = new Blob([content], { type: mime });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    a.click();
    URL.revokeObjectURL(a.href);
}

function truncate(s, n) {
    return s.length > n ? s.slice(0, n - 1) + '\u2026' : s;
}

// ─── Init ────────────────────────────────────
connect();
editor.focus();
</script>
